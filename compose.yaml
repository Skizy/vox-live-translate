services:
  app:
    build: .
    container_name: vox-live-translate
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vox:${POSTGRES_PASSWORD}@db:5432/vox
      NITRO_HOST: 0.0.0.0
      PORT: ${APP_PORT:-5080}
    ports:
      - "127.0.0.1:${APP_PORT:-5080}:${APP_PORT:-5080}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: vox-live-translate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: vox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox -d vox"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: vox-live-translate-postgres-data
